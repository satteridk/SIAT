sentence=Evaluate math expressions from strings at runtime on Arduino and ESP32.
paragraph=MathParser parses and evaluates math expression strings at runtime with no dependencies beyond math.h. Supports all standard operators (+,-,*,/,^,%), built-in functions (sin, cos, sqrt, log, pow, abs, ceil, floor, round, atan2 and more), built-in constants (pi, e), user-defined variables bound by pointer, and custom user functions (0-3 arguments). Ideal for config-driven formulas, user-entered expressions, sensor calibration curves, and dynamic thresholds stored in EEPROM or SPIFFS.
category=Data Processing
